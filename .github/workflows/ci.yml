name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            django: '5.2'
          - python: '3.14'
            django: '5.2'
          - python: '3.12'
            django: '6.0'
          - python: '3.14'
            django: '6.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest "Django==${{ matrix.django }}.*"
      - run: python -m pytest -q
      - run: python -m django makemigrations --check --dry-run --settings=example.settings

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build ruff twine
      - run: ruff check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel and bundled admin templates
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl pytest
          .wheel-venv/bin/python -m django check --settings=example.settings
          .wheel-venv/bin/python -m pytest -q -o pythonpath=. tests/test_admin.py tests/test_example.py
