[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-csv-import"
version = "0.1.0"
description = "Explicit, validated CSV imports for Django models and admin"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<6.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
